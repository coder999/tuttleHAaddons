name: Console Agent
slug: console_agent
description: Pushes this host's CPU/RAM/disk and add-on state to a console endpoint you configure
version: "0.2.0"
arch:
  - amd64
  - aarch64
startup: services
boot: auto
hassio_api: true
hassio_role: manager
options:
  ingest_url: "https://console.example.com/api/ingest"
  ingest_token: ""
  host_id: "homeassistant"
  interval_seconds: 30
  addon_stats: true
schema:
  ingest_url: url
  ingest_token: password
  host_id: str
  interval_seconds: int(10,600)
  addon_stats: bool
