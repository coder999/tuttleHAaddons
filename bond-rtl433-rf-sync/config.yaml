name: Bond-rtl_433 RF Sync
slug: bond_rtl433_rf_sync
description: Corrects Bond Bridge's believed fan/light state from wall-switch RF presses, without transmitting anything
version: "1.1.0"
arch:
  - amd64
  - aarch64
startup: services
boot: auto
usb: true
map:
  - data:rw
options:
  bond_host: "192.0.2.10"
  bond_token: ""
  rtl433_source: "local"
  rtl433_source_host: ""
  rtl433_source_port: 1234
  rtl433_frequency: 304250000
  rtl433_sample_rate: 2048000
  rtl433_gain: 49.6
  rtl433_stale_timeout_seconds: 21600.0
  rtl433_liveness_probe_interval_seconds: 60.0
  rtl433_liveness_probe_timeout_seconds: 10.0
  debounce_seconds: 3.0
  dry_run: false
  # The values below are EXAMPLES, not working defaults -- they describe a
  # made-up house so the shape of each option is visible in the UI. Replace
  # every one of them; see "Finding your own values" in README.md.
  # 192.0.2.10 is from RFC 5737's documentation range, so an unconfigured
  # add-on cannot reach a real device on your network.
  code_table:
    - room: example_room
      button: speed
      stable_id: "aaa"
    - room: example_room
      button: light
      stable_id: "aab"
    - room: example_room
      button: power
      stable_id: "aac"
  room_devices:
    - room: example_room
      bond_device_id: "0000000000000000"
      max_speed: 3
schema:
  bond_host: str
  bond_token: password
  rtl433_source: list(local|rtl_tcp)
  rtl433_source_host: str?
  rtl433_source_port: port?
  rtl433_frequency: int
  rtl433_sample_rate: int
  rtl433_gain: float
  rtl433_stale_timeout_seconds: float
  rtl433_liveness_probe_interval_seconds: float
  rtl433_liveness_probe_timeout_seconds: float
  debounce_seconds: float
  dry_run: bool
  code_table:
    - room: str
      button: list(power|light|speed)
      stable_id: str
  room_devices:
    - room: str
      bond_device_id: str
      max_speed: int
ingress: true
ingress_port: 8100
panel_icon: mdi:radio-tower
