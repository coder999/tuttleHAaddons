name: Bond-rtl_433 RF Sync
slug: bond_rtl433_rf_sync
description: Corrects Bond Bridge's believed fan/light state from wall-switch RF presses, without transmitting anything
version: "0.2.1"
arch:
  - amd64
  - aarch64
startup: services
boot: auto
usb: true
map:
  - data:rw
options:
  bond_host: "192.168.0.110"
  bond_token: ""
  rtl433_source: "local"
  rtl433_source_host: ""
  rtl433_source_port: 1234
  rtl433_frequency: 304250000
  rtl433_sample_rate: 2048000
  rtl433_gain: 49.6
  debounce_seconds: 3.0
  dry_run: false
  code_table:
    - room: livingroom
      button: speed
      stable_id: "1ff"
    - room: livingroom
      button: light
      stable_id: "1f9"
    - room: livingroom
      button: power
      stable_id: "1d9"
    - room: diningroom
      button: speed
      stable_id: "27f"
    - room: diningroom
      button: light
      stable_id: "279"
    - room: diningroom
      button: power
      stable_id: "259"
    - room: bedroom
      button: speed
      stable_id: "2ff"
    - room: bedroom
      button: light
      stable_id: "2f9"
    - room: bedroom
      button: power
      stable_id: "2d9"
  room_devices:
    - room: livingroom
      bond_device_id: "ce4d90389da6937f"
      max_speed: 3
    - room: diningroom
      bond_device_id: "33c72108a1a2548d"
      max_speed: 3
    - room: bedroom
      bond_device_id: "3e9252a7323111d2"
      max_speed: 3
schema:
  bond_host: str
  bond_token: password
  rtl433_source: list(local|rtl_tcp)
  rtl433_source_host: str?
  rtl433_source_port: port?
  rtl433_frequency: int
  rtl433_sample_rate: int
  rtl433_gain: float
  debounce_seconds: float
  dry_run: bool
  code_table:
    - room: str
      button: list(power|light|speed)
      stable_id: str
  room_devices:
    - room: str
      bond_device_id: str
      max_speed: int
ingress: true
ingress_port: 8100
panel_icon: mdi:fan-alert
