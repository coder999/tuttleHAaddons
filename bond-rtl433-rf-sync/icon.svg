<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#212b3a"/>
      <stop offset="1" stop-color="#141a24"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="128" height="128" rx="26" fill="url(#bg)"/>

  <!-- radio waves broadcasting from a source point toward the fan -->
  <g fill="none" stroke="#2dd4bf" stroke-linecap="round">
    <path d="M 100 68 A 44 44 0 0 1 56 24" stroke-width="6" opacity="0.4"/>
    <path d="M 100 54 A 30 30 0 0 1 70 24" stroke-width="6" opacity="0.65"/>
    <path d="M 100 40 A 16 16 0 0 1 84 24" stroke-width="6" opacity="0.9"/>
  </g>
  <circle cx="100" cy="24" r="4.5" fill="#2dd4bf"/>

  <!-- fan -->
  <g transform="translate(46,90) rotate(15)">
    <g fill="#f5a623">
      <path d="M 0 0 C 16 -3 28 -16 25 -30 C 23.5 -37 15 -39 8 -34 C 2 -29 0 -14 0 0 Z"/>
      <path d="M 0 0 C 16 -3 28 -16 25 -30 C 23.5 -37 15 -39 8 -34 C 2 -29 0 -14 0 0 Z" transform="rotate(120)"/>
      <path d="M 0 0 C 16 -3 28 -16 25 -30 C 23.5 -37 15 -39 8 -34 C 2 -29 0 -14 0 0 Z" transform="rotate(240)"/>
    </g>
    <circle cx="0" cy="0" r="8" fill="#141a24"/>
    <circle cx="0" cy="0" r="8" fill="none" stroke="#f5a623" stroke-width="2"/>
  </g>
</svg>
